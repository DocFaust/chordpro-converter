name: SonarQube

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Tests ausführen (mit Coverage)
        run: npm run test:ci

      - name: Lint für Sonar ausführen
        run: npm run lint:sonar

      # Dependabot-Läufe bekommen keine Actions-Secrets. Ohne Token bricht der
      # Scan mit "Not authorized" ab, obwohl die übrigen Prüfungen grün sind.
      - name: Sonar-Token prüfen
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube wird übersprungen, weil SONAR_TOKEN in diesem Lauf nicht verfügbar ist."
          fi

      - name: Java für Sonar einrichten
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.eslint.reportPaths=reports/eslint/eslint-sonar.json